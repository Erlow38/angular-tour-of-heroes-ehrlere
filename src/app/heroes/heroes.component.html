<div class="filter">
  <label>Filter:</label>
  <select [(ngModel)]="selectedFilter" id="filter-select">
    <option value="defaultSort">-- select a sort --</option>
    <option value="name">name</option>
    <option value="attack">attack</option>
    <option value="dodge">dodge</option>
    <option value="damage">damage</option>
    <option value="hp">hp</option>
  </select>
  <input [(ngModel)]="searchHero" (input)="searchHeroes()" type="search" id="search-hero" placeholder="search a hero">
</div>
<h2>My Heroes</h2>
<ul class="heroes">
  <li *ngFor="let hero of heroes  | customOrderBy: selectedFilter">
    <a routerLink="/detail-hero/{{hero.id}}">
      <span class="badge">*</span>{{hero.name}}
    </a>
  </li>
</ul>
<button type="button" (click)="addHero()">add hero</button>
